# Time span covered by each of Alfred Laubmann's 34 diary volumes.
#
# Source: the title page of every volume ("N. Ornithologische Tagebuchnotizen
# von … <Monat Jahr> - <Monat Jahr>", scan 3 in the HistOrniGraph region JSONs;
# `tools/build_volume_coverage.py` re-derives this table from corpus.json and
# checks it against the empirical entry-date distribution). Two exceptions:
#   - Vol 15's scanned title page is Vol 1's (the known Vol 1 ↔ Vol 15 scan
#     contamination); its span is taken from the neighbours (Vol 14 ends May 1937,
#     Vol 16 starts Oct 1938) and the empirical distribution (P2 1937-07 … P98 1938-09).
#   - Vol 34's title page has an open end ("Mai 1964 - "); the diaries end in
#     1965 (last entries 1965-09), so December 1965 closes it.
#
# Used by `normalization/coverage.py` (config `qa.coverage`): entries dated
# outside their volume's span ± tolerance are OCR-corrected when the sequence
# neighbours agree on the year, or flagged for review. Month precision.
volumes:
  1:  {start: 1917-04, end: 1918-04, source: "title page: April 1917 - April 1918"}
  2:  {start: 1918-05, end: 1919-08, source: "title page: Mai 1918 - August 1919"}
