# Sample build using the Gemini LLM extraction backend.
# Requires: pip install -e ".[llm]"  and an API key in the environment
#   export GOOGLE_API_KEY=...        (or GEMINI_API_KEY)
# Calls are cached (data/cache/llm) and run at temperature 0, so re-runs are
# free and reproducible. Switch back to rules by using configs/sample.yaml.
corpus:
  entries: data/corpus/entries.csv
  multimodal: data/corpus/multimodal.md

sample:
  volume: 2

extraction:
  backend: llm
  provider: google
  model: gemini-3.5-flash       # keep in sync with configs/models.yaml extraction.model
  api_key_env: GOOGLE_API_KEY
  temperature: 0.0
  max_output_tokens: 16384      # caps each response; stops runaway generation. The
                                # model-facing fields grew and thinking tokens may count
                                # against the cap -- truncated answers are not cached
  timeout: 120                  # seconds per request; a stalled call fails, not hangs

taxa:
  links_long_path: null

qa:
  enabled: true
  exclude: true          # drop misdated entries + garbage taxa; recorded to review/qa_flags.csv
  # year_min: 1918       # optional explicit span; else derived from the data (median +/- 2)
  # year_max: 1919

# Documentation block — enable to link taxa (GBIF) and persons (Wikidata).
linking:
  enabled: false             # absent/false = stage skipped entirely (offline runs, tests)
  offline: false             # true = answer only from the on-disk caches, never touch the network
  cache_dir: data/cache/linking   # gbif_cache.json + wikidata_cache.json (resumable, safe to interrupt)
  review_dir: data/review    # taxon_link_review.csv + person_link_review.csv (trailing decision column)
  limit: 0                   # cap uncached lookups per section per run (0 = all); partial runs resume via cache
  taxa:
    enabled: true
    reviewed_csv: null       # adjudicated taxon_link_review.csv from a prior run (decision y/yes/merge/1)
    sleep: 0.2               # seconds between uncached GBIF requests
    gbif:
      min_confidence: 90         # accept EXACT at/above -> skos:exactMatch
      fuzzy_min_confidence: 95   # accept FUZZY at/above -> skos:closeMatch
    llm:
      enabled: true
      provider: google
      model: gemini-3.5-flash    # keep in sync with extraction.model
      api_key_env: GOOGLE_API_KEY
      cache_dir: data/cache/linking_llm
      prompt_dir: prompts        # uses prompts/taxon_normalization.md (revived)
      min_confidence: 0.7        # LLM proposals below this go straight to review
      thinking_level: low        # minimal | low | medium | high
      max_output_tokens: 1024    # small JSON answer; headroom for thinking tokens
  persons:
    enabled: true
    reviewed_csv: null
    sleep: 0.5
    language: de

paths:
  ontology: ontologies/laubmann.ttl
  shapes: ontologies/shacl_shapes.ttl
  jsonld_context: schemas/jsonld_context.json

dwca:
  publisher: Laubmann KG Project
  license: CC-BY-4.0
  title: "Laubmann ornithological field diaries 1917–1965 — observations (sample, vol. 2)"
  package_id: laubmann-kg-sample

validate: true
