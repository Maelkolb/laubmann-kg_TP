# Sample build using the Gemini LLM extraction backend.
# Requires: pip install -e ".[llm]"  and an API key in the environment
#   export GOOGLE_API_KEY=...        (or GEMINI_API_KEY)
# Calls are cached (data/cache/llm) and run at temperature 0, so re-runs are
# free and reproducible. Switch back to rules by using configs/sample.yaml.
corpus:
  entries: data/corpus/entries.csv
  multimodal: data/corpus/multimodal.md

sample:
  volume: 2

extraction:
  backend: llm
  provider: google
  model: gemini-3.5-flash       # keep in sync with configs/models.yaml extraction.model
  api_key_env: GOOGLE_API_KEY
  temperature: 0.0
  max_output_tokens: 4096       # caps each response; stops runaway generation
  timeout: 120                  # seconds per request; a stalled call fails, not hangs

taxa:
  links_long_path: null

qa:
  enabled: true
  exclude: true          # drop misdated entries + garbage taxa; recorded to review/qa_flags.csv
  # year_min: 1918       # optional explicit span; else derived from the data (median +/- 2)
  # year_max: 1919

paths:
  ontology: ontologies/laubmann.ttl
  shapes: ontologies/shacl_shapes.ttl
  jsonld_context: schemas/jsonld_context.json

dwca:
  publisher: Laubmann KG Project
  license: CC-BY-4.0

validate: true
